name: Publish Windows release assets

# The build artifacts are produced locally and committed under release/.
# This workflow attaches them to a GitHub Release so they get real
# https://github.com/.../releases/download/... URLs.

on:
  push:
    branches:
      - arena/d94c8bb2-roblox
    paths:
      - 'release/**'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the artifacts to
        required: false
        default: space-miner-v1.1.0

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch holding the artifacts
        uses: actions/checkout@v4

      - name: Verify artifacts exist
        run: |
          ls -la release/
          cd release && sha256sum -c SHA256SUMS.txt

      - name: Upload artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || 'space-miner-v1.1.0' }}" \
            release/SPACE_MINER_WINDOWS.zip \
            release/SPACE_MINER_SETUP.exe \
            release/SPACE_MINER_SOURCE.zip \
            release/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --clobber

      - name: Show the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.tag || 'space-miner-v1.1.0' }}" --repo "${{ github.repository }}" --json assets
