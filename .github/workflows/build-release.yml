name: Build, Test & Publish SPACE MINER Release

on:
  push:
    branches:
      - "arena/**"
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build-test-release:
    name: Windows x64 Build, Engine Tests, Installer & Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Run Asset/GDScript Integrity Suite
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Assets, 53 PBR GLBs, Cards, Audio & GDScript AST
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy pygltflib "gdtoolkit==4.*" pytest fonttools
          $ptOut = pytest -v --tb=short tests/test_assets_and_spec.py 2>&1
          $ptExit = $LASTEXITCODE
          $ptOut | ForEach-Object { Write-Host $_ }
          if ($ptExit -ne 0) {
            $errSummary = ($ptOut | Select-Object -Last 15) -join " | "
            Write-Host "::error title=PytestFailure::$errSummary"
            exit 1
          }
          Write-Host "::notice title=StaticTests::pytest asset, GLB PBR, card art, audio, and gdparse suite passed."

      - name: Install Godot 4.3-stable (Win64) & Export Templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "C:\godot" | Out-Null
          $godotZip = "C:\godot\godot.zip"
          $tpzFile  = "C:\godot\templates.tpz"
          $rcedit   = "C:\godot\rcedit-x64.exe"

          Write-Host "Downloading Godot 4.3-stable Win64..."
          curl.exe -L --retry 4 -o $godotZip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip"
          Expand-Archive -Path $godotZip -DestinationPath "C:\godot" -Force

          Write-Host "Downloading Godot 4.3-stable Export Templates..."
          curl.exe -L --retry 4 -o $tpzFile "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          7z x $tpzFile -o"C:\godot\tpl_extract" -y | Out-Null

          $tplDest = Join-Path $env:APPDATA "Godot\export_templates\4.3.stable"
          New-Item -ItemType Directory -Force -Path $tplDest | Out-Null
          Copy-Item -Path "C:\godot\tpl_extract\templates\windows_*_x86_64*" -Destination $tplDest -Force

          curl.exe -L --retry 4 -o $rcedit "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          Copy-Item $rcedit "C:\godot\rcedit.exe" -Force
          "C:\godot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $edCfgDir = Join-Path $env:APPDATA "Godot"
          $edCfg = Join-Path $edCfgDir "editor_settings-4.tres"
          @(
            '[gd_resource type="EditorSettings" format=3]',
            '',
            '[resource]',
            'export/windows/rcedit = "C:/godot/rcedit.exe"',
            'filesystem/tools/rcedit = "C:/godot/rcedit.exe"'
          ) | Set-Content -Path $edCfg -Encoding UTF8

          if (-not (Test-Path "$tplDest\windows_release_x86_64.exe")) {
            Write-Host "::error::Export template windows_release_x86_64.exe missing!"
            exit 1
          }

      - name: Import 3D GLB/Shader/Audio Assets & Run Godot Engine Unit Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $godotConsole = "C:\godot\Godot_v4.3-stable_win64_console.exe"

          Write-Host "Importing project resources..."
          $impOut = & $godotConsole --headless --path "$PWD" --import 2>&1
          $hasScriptErr = $false
          foreach ($line in $impOut) {
            Write-Host $line
            if ($line -match "SCRIPT ERROR|Parse Error|Failed to load script") {
              Write-Host "::error::$line"
              $hasScriptErr = $true
            }
          }
          if ($hasScriptErr) {
            Write-Host "::error::GDScript parse/load error detected during --import!"
            exit 1
          }

          Write-Host "Running automated Godot 4.3 TestScene.tscn suite..."
          $testOut = & $godotConsole --headless --path "$PWD" "res://tests/TestScene.tscn" 2>&1
          $exitCode = $LASTEXITCODE
          foreach ($line in $testOut) {
            Write-Host $line
            if ($line -match "SCRIPT ERROR|Parse Error|Failed to load script|Can't set_rect|TEST FAILED|FAILURE:") {
              Write-Host "::error::$line"
              $hasScriptErr = $true
            }
            if ($line -match "TEST SUMMARY:") {
              Write-Host "::notice title=EngineUnitTests::$line"
            }
          }
          if ($hasScriptErr -or $exitCode -ne 0 -or -not (($testOut -join "`n") -match "ALL_AUTOMATED_TESTS_PASSED_OK")) {
            Write-Host "::error::Godot automated unit test suite failed (exit=$exitCode)"
            exit 1
          }

      - name: Export 64-Bit Windows Standalone Build & Package Archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $godotConsole = "C:\godot\Godot_v4.3-stable_win64_console.exe"
          New-Item -ItemType Directory -Force -Path "build\windows" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $expOut = & $godotConsole --headless --path "$PWD" --export-release "Windows Desktop" "build/windows/SPACE_MINER.exe" 2>&1
          $expExit = $LASTEXITCODE
          foreach ($line in $expOut) {
            Write-Host $line
            if ($line -match "ERROR:") {
              Write-Host "::error::$line"
            }
          }
          if ($expExit -ne 0 -or -not (Test-Path "build\windows\SPACE_MINER.exe") -or -not (Test-Path "build\windows\SPACE_MINER.pck")) {
            Write-Host "::error::Windows export failed to produce SPACE_MINER.exe and SPACE_MINER.pck"
            exit 1
          }

          Copy-Item "README_CONTROLS.txt" "build\windows\README_CONTROLS.txt" -Force
          Copy-Item "THIRDPARTY_LICENSES.txt" "build\windows\THIRDPARTY_LICENSES.txt" -Force

          # Package SPACE_MINER_WINDOWS.zip with clean root folder SPACE_MINER_WINDOWS/
          New-Item -ItemType Directory -Force -Path "build\package_root\SPACE_MINER_WINDOWS" | Out-Null
          Copy-Item -Path "build\windows\*" -Destination "build\package_root\SPACE_MINER_WINDOWS" -Recurse -Force
          7z a -tzip "dist\SPACE_MINER_WINDOWS.zip" ".\build\package_root\SPACE_MINER_WINDOWS" | Out-Null

          # Package clean SPACE_MINER_SOURCE.zip via git archive
          git archive --format=zip --prefix="SPACE_MINER_SOURCE/" -o "dist/SPACE_MINER_SOURCE.zip" HEAD

      - name: Compile Inno Setup Installer & Run Packaged Self-Test Verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer\space_miner_setup.iss"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist\SPACE_MINER_SETUP.exe")) {
            Write-Host "::error::Inno Setup failed to compile SPACE_MINER_SETUP.exe"
            exit 1
          }

          # Silently install SPACE_MINER_SETUP.exe to a clean directory and run --self-test on the installed EXE!
          $installDir = "C:\SpaceMinerInstalledTest"
          $innoLog = "C:\inno_install.log"
          $proc = Start-Process -FilePath "$PWD\dist\SPACE_MINER_SETUP.exe" -ArgumentList "/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$installDir`" /LOG=`"$innoLog`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path "$installDir\SPACE_MINER.exe")) {
            if (Test-Path $innoLog) {
              $tail = (Get-Content $innoLog | Select-Object -Last 25) -join " | "
              Write-Host "::error title=InnoInstallLog::$tail"
            }
            Write-Host "::error::Silent install test of SPACE_MINER_SETUP.exe failed (exit=$($proc.ExitCode))"
            exit 1
          }

          $reportFile = "$installDir\selftest_report.txt"
          $env:SPACE_MINER_SELFTEST_OUT = $reportFile
          $stProc = Start-Process -FilePath "$installDir\SPACE_MINER.exe" -ArgumentList "--headless","--self-test" -Wait -PassThru
          if ($stProc.ExitCode -ne 0 -or -not (Test-Path $reportFile)) {
            Write-Host "::error::Installed SPACE_MINER.exe --self-test failed (exit=$($stProc.ExitCode))"
            exit 1
          }
          $repText = Get-Content -Path $reportFile -Raw
          Write-Host $repText
          if (-not ($repText -match "SPACE_MINER_SELF_TEST_OK")) {
            Write-Host "::error::Self-test report did not pass: $repText"
            exit 1
          }
          Write-Host "::notice title=PackagedSelfTest::Installed SPACE_MINER.exe passed MainMenu + Hangar + 5 Space Sectors + Save/Load runtime verification."

      - name: Compute SHA-256 Checksums & Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $winZip = Get-Item "dist\SPACE_MINER_WINDOWS.zip"
          $setupExe = Get-Item "dist\SPACE_MINER_SETUP.exe"
          $srcZip = Get-Item "dist\SPACE_MINER_SOURCE.zip"

          $winSha = (Get-FileHash $winZip.FullName -Algorithm SHA256).Hash.ToLower()
          $setupSha = (Get-FileHash $setupExe.FullName -Algorithm SHA256).Hash.ToLower()
          $srcSha = (Get-FileHash $srcZip.FullName -Algorithm SHA256).Hash.ToLower()

          $shaLines = @(
            "$winSha  SPACE_MINER_WINDOWS.zip",
            "$setupSha  SPACE_MINER_SETUP.exe",
            "$srcSha  SPACE_MINER_SOURCE.zip"
          )
          $shaLines | Set-Content -Path "dist\SHA256SUMS.txt" -Encoding ASCII

          Write-Host "::notice title=SHA256_WINDOWS_ZIP::$winSha ($($winZip.Length) bytes)"
          Write-Host "::notice title=SHA256_SETUP_EXE::$setupSha ($($setupExe.Length) bytes)"
          Write-Host "::notice title=SHA256_SOURCE_ZIP::$srcSha ($($srcZip.Length) bytes)"

          $tag = "space-miner-v1.0.0"
          $notes = @"
          # SPACE MINER: BUILD & CONQUER — v2.1.0 (64-Bit Windows · Full Art, HUD & Settings Expansion)

          Complete standalone 64-bit Windows 3D space mining, modular ship construction, orbital combat and collectible card progression game built on **Godot Engine 4.3**.

          ### v2.1.0 Highlights
          - **Hall of Achievements — a real empty-space 3D room**: every achievement card ever earned physically floats around the pilot on a glowing dais (nebula haze, star field, per-rarity emissive plaques). Drag to look around, mouse wheel to orbit closer, click any card for its dossier, `F` to step through the collection, `ESC` to return. Cards refresh live as new UTC-bucket achievements are completed.
          - **Genuinely Unique Artwork, Not Recolors**: all **42 crew fighter portraits**, **18 upgrade protocol icons** and **30 achievement dioramas** are rendered per-item through an offline CPU PBR pipeline (mesh-specific geometry, materials, lighting, backdrop) — `42/42`, `18/18` and `30/30` distinct SHA-256 digests, verified with zero duplicates.
          - **Redrawn Upgrade Core Icons & Achievement Backgrounds**: upgrade icons are rendered from the actual installed ship equipment models; every rarity now owns a procedurally shaded metal plaque (starburst rays, laurel wreath, emblem, corner brackets, brushed micro-relief, specular + rim + AO + film grain) that is also used as the shared GUI panel material, so menus, the station modal and achievement cards speak one visual language.
          - **Meteor Shattering Into Collectible Debris**: destroyed asteroids now burst into 3–6 visible, physics-thrown rock chunks (5 on full shatter) with boosted explosion energy, each individually magnetically collectible — no more vanishing rocks.
          - **Portal-Only Hangar Return**: the auxiliary steering reticle was removed (only the exact 3D ballistic Crosshair #2 remains) and every instant-exit path is gone — the warp gate (`< 9.5 m`) is now the single way back to the hangar; pause menu buttons only close the pause overlay.
          - **Transparent Booster Pack Cutouts**: pack art is alpha-cut to its silhouette so the opening ceremony shows the glowing wings and flares over the live 3D scene with no black rectangular edges.
          - **Expanded Settings (5 groups, 19 live controls)**: DISPLAY & SCREEN (3 graphics presets, V-Sync, frame-rate limit, UI scale, fullscreen, reduced motion), AUDIO (master/music/SFX + mute), FLIGHT CONTROLS (sensitivity, field of view, cockpit shake, invert pitch axis), PILOT HUD (crosshair opacity, resource panel, achievement popups) and DATA & LANGUAGE (10 languages, auto-save toggle, full progress reset with confirmation). Every control is functional, clamped, applied live to the engine and round-trips through the SHA-256 save file.
          - **Real Impact Feedback Systems**: trauma-based cockpit camera shake driven by meteor destruction and plasma hits, plus gold achievement popups in flight and in the station, both respecting the reduced-motion and popup settings.
          - **10 World Languages (Russian Primary Default)** with bundled SIL OFL `Exo 2`, `JetBrains Mono` and rebuilt CJK subsets — a regression test now proves **every** localized string in the project renders in the shipped font chain (`0` missing glyphs for Russian, Simplified Chinese, Japanese, Korean and Turkish).
          - **Studio 44.1 kHz Sci-Fi Audio**: all 23 ambient loops and SFX synthesized at `44.1 kHz` 16-bit PCM with filtered warm harmonics and musical cadences.

          ## Downloads
          - **Windows Standalone Portable (`SPACE_MINER_WINDOWS.zip`)**: Extract and launch `SPACE_MINER.exe`. No external runtimes required.
          - **Windows Installer (`SPACE_MINER_SETUP.exe`)**: Bilingual (Russian/English) Inno Setup 64-bit Windows installer with Start Menu & optional Desktop shortcuts and uninstaller.
          - **Complete Source Code (`SPACE_MINER_SOURCE.zip`)**: Clean Godot 4.3 project, shaders, 54 PBR `.glb` 3D assets, 75 card/pack illustrations, 44.1 kHz audio, multilingual fonts, automated test suites, and installer script.

          ## SHA-256 Checksums
          ```text
          $winSha  SPACE_MINER_WINDOWS.zip
          $setupSha  SPACE_MINER_SETUP.exe
          $srcSha  SPACE_MINER_SOURCE.zip
          ```
          "@

          $notes | Set-Content -Path "dist\RELEASE_NOTES.md" -Encoding UTF8

          $ErrorActionPreference = "Continue"
          $exists = $false
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          $ErrorActionPreference = "Stop"

          if ($exists) {
            gh release upload $tag "dist\SPACE_MINER_WINDOWS.zip" "dist\SPACE_MINER_SETUP.exe" "dist\SPACE_MINER_SOURCE.zip" "dist\SHA256SUMS.txt" --clobber --repo "${{ github.repository }}"
            gh release edit $tag --title "SPACE MINER: BUILD & CONQUER v2.1.0" --notes-file "dist\RELEASE_NOTES.md" --repo "${{ github.repository }}"
          } else {
            gh release create $tag "dist\SPACE_MINER_WINDOWS.zip" "dist\SPACE_MINER_SETUP.exe" "dist\SPACE_MINER_SOURCE.zip" "dist\SHA256SUMS.txt" --target "${{ github.sha }}" --title "SPACE MINER: BUILD & CONQUER v2.1.0" --notes-file "dist\RELEASE_NOTES.md" --repo "${{ github.repository }}"
          }

          Write-Host "::notice title=ReleasePublished::https://github.com/${{ github.repository }}/releases/tag/$tag"
