name: Windows x64 game build

on:
  push:
    branches:
      - arena/b3b7737d-roblox
    paths:
      - 'project/**'
      - 'tools/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare release URLs
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          "GODOT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "GODOT_BASE=https://github.com/godotengine/godot/releases/download/$version" | Out-File $env:GITHUB_ENV -Append
          $temp = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "GODOT_TEMP=$temp" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Prepared Godot $version downloads in $temp"

      - name: Download Godot Windows editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:GODOT_BASE/Godot_v4.7.2-stable_win64.exe.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 --retry-all-errors --output "$env:GODOT_TEMP/editor.zip" $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Godot editor download::curl exited $LASTEXITCODE for $url"; exit $LASTEXITCODE }
          Write-Host "Editor archive size: $((Get-Item "$env:GODOT_TEMP/editor.zip").Length) bytes"

      - name: Download matching export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 --retry-all-errors --output "$env:GODOT_TEMP/templates.tpz" $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Godot templates download::curl exited $LASTEXITCODE for $url"; exit $LASTEXITCODE }
          Write-Host "Template archive size: $((Get-Item "$env:GODOT_TEMP/templates.tpz").Length) bytes"

      - name: Install editor and templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Expand-Archive "$env:GODOT_TEMP/editor.zip" -DestinationPath "$env:GODOT_TEMP/editor" -Force
            Write-Host "Editor archive extracted: $((Get-ChildItem "$env:GODOT_TEMP/editor" -Recurse -File | Measure-Object).Count) files"
            Rename-Item "$env:GODOT_TEMP/templates.tpz" 'templates.zip'
            Expand-Archive "$env:GODOT_TEMP/templates.zip" -DestinationPath "$env:GODOT_TEMP/export" -Force
            Write-Host "Template archive extracted: $((Get-ChildItem "$env:GODOT_TEMP/export" -Recurse -File | Measure-Object).Count) files"
            $godot = Get-ChildItem "$env:GODOT_TEMP/editor" -Filter 'Godot_v*_win64.exe' -Recurse | Select-Object -First 1
            if (-not $godot) { throw "Godot Windows editor executable was not found in $env:GODOT_TEMP/editor" }
            $templateDir = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
            New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
            $templates = Get-ChildItem "$env:GODOT_TEMP/export" -Directory -Recurse | Where-Object { $_.Name -eq 'templates' } | Select-Object -First 1
            if (-not $templates) { throw "Godot export template folder was not found. Extracted entries: $((Get-ChildItem "$env:GODOT_TEMP/export" -Force | Select-Object -ExpandProperty Name) -join ', ')" }
            Copy-Item "$($templates.FullName)/*" $templateDir -Recurse -Force
            Write-Host "Installed template entries: $((Get-ChildItem $templateDir -File | Measure-Object).Count)"
            "GODOT_EXE=$($godot.FullName)" | Out-File $env:GITHUB_ENV -Append
            & $godot.FullName --version
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Godot editor --version failed with exit code $LASTEXITCODE" }
          } catch {
            $diagnostic = $_.Exception.ToString() -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Godot installation diagnostic::$diagnostic"
            throw
          }

      - name: Import project and compile scripts
        shell: pwsh
        run: |
          $output = & $env:GODOT_EXE --headless --editor --path "$PWD/project" --import --quit 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $details = (($output | Select-Object -Last 12) -join ' | ') -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Godot import diagnostic::$details"
            exit $code
          }

      - name: Headless startup smoke test
        shell: pwsh
        run: |
          $output = & $env:GODOT_EXE --headless --path "$PWD/project" --quit-after 120 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $details = (($output | Select-Object -Last 16) -join ' | ') -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Godot runtime diagnostic::$details"
            exit $code
          }

      - name: Export Windows x64 executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $project = Join-Path $workspace 'project'
          $outDir = Join-Path $workspace 'build'
          $exePath = Join-Path $outDir 'HORIZON_VELOCITY.exe'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Write-Host "Export workspace: $workspace"
          Write-Host "Executable target: $exePath"
          $output = & $env:GODOT_EXE --headless --path $project --export-release 'Windows Desktop' $exePath 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($null -ne $code -and $code -ne 0) {
            $details = (($output | Select-Object -Last 16) -join ' | ') -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Godot export diagnostic::$details"
            exit $code
          }
          $found = Get-ChildItem -Path $workspace -Filter 'HORIZON_VELOCITY*' -Recurse -File -ErrorAction SilentlyContinue
          if (-not (Test-Path -Path $exePath -PathType Leaf)) {
            $where = ($found | ForEach-Object { $_.FullName + ' (' + $_.Length + ' bytes)' }) -join '; '
            if (-not $where) { $where = 'No named executable or companion file found under workspace.' }
            $where = ("Expected $exePath; $where") -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Exported file not found::$where"
            exit 1
          }
          $exeItem = Get-Item -Path $exePath -Force
          $nearby = (Get-ChildItem -Path $workspace -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'HORIZON_VELOCITY*' } | ForEach-Object { $_.FullName + ':' + $_.Length }) -join '; '
          $diagnostic = "workspace=$workspace; exe=$($exeItem.FullName); length=$($exeItem.Length); nearby=$nearby" -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
          Write-Output "::notice title=Export file diagnostic::$diagnostic"
          Write-Host "Verified executable size: $($exeItem.Length) bytes"
          Get-ChildItem -Path $outDir -Force | Format-Table Name,Length
          $event = Get-Content -Path $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.head_commit.message.Contains('[release-alpha]')) {
            $tag = 'horizon-velocity-v0.1.0-alpha'
            $assets = @($exePath)
            $pck = Join-Path $outDir 'HORIZON_VELOCITY.pck'
            if (Test-Path -Path $pck -PathType Leaf) { $assets += $pck }
            if ([string]::IsNullOrEmpty($env:GH_TOKEN)) { throw 'GH_TOKEN is missing.' }
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            $body = @{
              tag_name = $tag
              target_commitish = $env:GITHUB_SHA
              name = 'Horizon Velocity 0.1.0-alpha — Windows x64'
              body = 'Experimental Windows alpha build of the Aurora Coast vertical slice. Includes one featured coupe configuration, one checkpoint sprint and the current prototype map. Not a finished AAA release; gameplay and performance still need full Windows QA.'
              draft = $false
              prerelease = $true
            } | ConvertTo-Json
            try {
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/Ritmirchic/Roblox/releases' -Method Post -Headers $headers -ContentType 'application/json' -Body $body
              $uploadBase = $release.upload_url -replace '\{\?name,label\}$',''
              foreach ($asset in $assets) {
                $assetName = [uri]::EscapeDataString([System.IO.Path]::GetFileName($asset))
                $uploadUrl = "$uploadBase`?name=$assetName"
                Write-Host "Uploading $assetName ($((Get-Item $asset).Length) bytes)"
                Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $asset | Out-Null
              }
              Write-Host "Published prerelease tag $tag"
            } catch {
              $diagnostic = $_.Exception.ToString()
              $annotation = $diagnostic -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Output "::error title=GitHub release API diagnostic::$annotation"
              throw
            }
          }
