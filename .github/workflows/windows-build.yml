name: Windows x64 game build

on:
  push:
    branches:
      - arena/b3b7737d-roblox
    paths:
      - 'project/**'
      - 'tools/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare release URLs
        shell: pwsh
        run: |
          $version = '4.7.2-stable'
          "GODOT_VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "GODOT_BASE=https://github.com/godotengine/godot/releases/download/$version" | Out-File $env:GITHUB_ENV -Append
          $temp = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "GODOT_TEMP=$temp" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Prepared Godot $version downloads in $temp"

      - name: Download Godot Windows editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:GODOT_BASE/Godot_v4.7.2-stable_win64.exe.zip"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 --retry-all-errors --output "$env:GODOT_TEMP/editor.zip" $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Godot editor download::curl exited $LASTEXITCODE for $url"; exit $LASTEXITCODE }
          Write-Host "Editor archive size: $((Get-Item "$env:GODOT_TEMP/editor.zip").Length) bytes"

      - name: Download matching export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:GODOT_BASE/Godot_v4.7.2-stable_export_templates.tpz"
          Write-Host "Downloading $url"
          curl.exe -L --fail --retry 3 --retry-all-errors --output "$env:GODOT_TEMP/templates.tpz" $url
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Godot templates download::curl exited $LASTEXITCODE for $url"; exit $LASTEXITCODE }
          Write-Host "Template archive size: $((Get-Item "$env:GODOT_TEMP/templates.tpz").Length) bytes"

      - name: Install editor and templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Expand-Archive "$env:GODOT_TEMP/editor.zip" -DestinationPath "$env:GODOT_TEMP/editor" -Force
            Write-Host "Editor archive extracted: $((Get-ChildItem "$env:GODOT_TEMP/editor" -Recurse -File | Measure-Object).Count) files"
            Rename-Item "$env:GODOT_TEMP/templates.tpz" 'templates.zip'
            Expand-Archive "$env:GODOT_TEMP/templates.zip" -DestinationPath "$env:GODOT_TEMP/export" -Force
            Write-Host "Template archive extracted: $((Get-ChildItem "$env:GODOT_TEMP/export" -Recurse -File | Measure-Object).Count) files"
            $godot = Get-ChildItem "$env:GODOT_TEMP/editor" -Filter 'Godot_v*_win64.exe' -Recurse | Select-Object -First 1
            if (-not $godot) { throw "Godot Windows editor executable was not found in $env:GODOT_TEMP/editor" }
            $templateDir = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
            New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
            $templates = Get-ChildItem "$env:GODOT_TEMP/export" -Directory -Recurse | Where-Object { $_.Name -eq 'templates' } | Select-Object -First 1
            if (-not $templates) { throw "Godot export template folder was not found. Extracted entries: $((Get-ChildItem "$env:GODOT_TEMP/export" -Force | Select-Object -ExpandProperty Name) -join ', ')" }
            Copy-Item "$($templates.FullName)/*" $templateDir -Recurse -Force
            Write-Host "Installed template entries: $((Get-ChildItem $templateDir -File | Measure-Object).Count)"
            "GODOT_EXE=$($godot.FullName)" | Out-File $env:GITHUB_ENV -Append
            & $godot.FullName --version
            if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "Godot editor --version failed with exit code $LASTEXITCODE" }
          } catch {
            $diagnostic = $_.Exception.ToString() -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Godot installation diagnostic::$diagnostic"
            throw
          }

      - name: Import project and compile scripts
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path "$PWD/project" --import --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import or GDScript compile failed.' }

      - name: Headless startup smoke test
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path "$PWD/project" --quit-after 120
          if ($LASTEXITCODE -ne 0) { throw 'Godot headless startup smoke test failed.' }

      - name: Export Windows x64 executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & $env:GODOT_EXE --headless --path "$PWD/project" --export-release 'Windows Desktop' "$PWD/build/HORIZON_VELOCITY.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed.' }
          if (-not (Test-Path 'build/HORIZON_VELOCITY.exe')) { throw 'Expected Windows executable was not created.' }
          Get-ChildItem build | Format-Table Name,Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: HORIZON_VELOCITY_WINDOWS
          path: |
            build/HORIZON_VELOCITY.exe
            build/HORIZON_VELOCITY.pck
          if-no-files-found: error
          retention-days: 30
