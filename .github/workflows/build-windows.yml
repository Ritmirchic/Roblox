name: Build Windows Release
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pygame numpy pillow PyInstaller
      - name: Run automated tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/test_game.py
      - name: Build DONT_LOOK_BACK.exe
        run: |
          python -m PyInstaller --clean --noconfirm packaging/DONT_LOOK_BACK.spec
          mkdir release
          copy dist\DONT_LOOK_BACK.exe release\DONT_LOOK_BACK.exe
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build DONT_LOOK_BACK_SETUP.exe
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DONT_LOOK_BACK_Windows
          path: |
            release/DONT_LOOK_BACK.exe
            release/DONT_LOOK_BACK_SETUP.exe
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DON'T LOOK BACK ${{ github.ref_name }}"
          body: "Windows release. Download DONT_LOOK_BACK.exe (portable) or DONT_LOOK_BACK_SETUP.exe (installer)."
          files: |
            release/DONT_LOOK_BACK.exe
            release/DONT_LOOK_BACK_SETUP.exe
