name: fetch-godot-toolchain

# CI relay: GitHub-hosted runners have full network egress, unlike the dev
# sandbox. Downloads official MIT-licensed Godot engine + Windows export
# templates, splits large binaries into git-pushable chunks, commits them to
# the `toolchain-bin` branch. Every step logs into fetch.log, which is pushed
# back on failure for offline diagnosis (sandbox cannot read Actions logs).
on:
  workflow_dispatch:
  push:
    branches: ["arena/7a439bd1-roblox"]
    paths: [".github/workflows/fetch-godot.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download editor
        id: editor
        continue-on-error: true
        run: |
          exec > fetch.log 2>&1
          set -x
          which curl unzip git sha256sum split
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          mkdir -p engine templates
          curl -fL --retry 3 --retry-delay 2 \
            "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o engine/godot-linux-x86_64.zip
          ls -lh engine/

      - name: Download templates
        id: templates
        continue-on-error: true
        run: |
          exec >> fetch.log 2>&1
          set -x
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -fL --retry 3 --retry-delay 2 \
            "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/tpl.tpz
          ls -lh /tmp/tpl.tpz

      - name: Extract Windows templates
        id: extract
        continue-on-error: true
        run: |
          exec >> fetch.log 2>&1
          set -x
          mkdir -p /tmp/tplx
          unzip -q /tmp/tpl.tpz -d /tmp/tplx
          ls -la /tmp/tplx/templates | head -30
          cp /tmp/tplx/templates/version.txt templates/
          # Godot 4.4+ embeds the PCK inside each template executable; only
          # standalone .exe templates are shipped.
          for n in windows_release_x86_64 windows_debug_x86_64; do
            cp "/tmp/tplx/templates/$n.exe" templates/
          done
          ls -lh templates/
          if ! curl -fL "https://raw.githubusercontent.com/godotengine/godot/master/LICENSE.txt" \
            -o GODOT-LICENSE.txt; then
            printf '%s\n' \
              'Godot Engine License (MIT)' \
              'Copyright (c) 2007-present Juan Linietsky, Ariel Manzur & Godot Engine contributors.' \
              'Permission is hereby granted, free of charge, to any person obtaining a copy' \
              'of this software and associated documentation files (the "Software"), to deal' \
              'in the Software without restriction, including without limitation the rights' \
              'to use, copy, modify, merge, publish, distribute, sublicense, and/or sell' \
              'copies of the Software, and to permit persons to whom the Software is' \
              'furnished to do so, subject to the following conditions:' \
              'The above copyright notice and this permission notice shall be included in all' \
              'copies or substantial portions of the Software.' \
              'THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR' \
              'IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,' \
              'FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE' \
              'AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER' \
              'LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,' \
              'OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE' \
              'SOFTWARE.' > GODOT-LICENSE.txt
          fi

      - name: Checksums and chunking
        id: chunk
        continue-on-error: true
        run: |
          exec >> fetch.log 2>&1
          set -x
          sha256sum engine/* templates/* GODOT-LICENSE.txt | tee SHA256SUMS
          find engine templates -type f -size +80M -print0 | while IFS= read -r -d '' f; do
            split -b 80M -d -a 3 "$f" "$f.part"
            rm "$f"
          done
          printf '%s\n' '# Godot 4.7.2 stable toolchain (relayed via GitHub Actions)' '' \
            'Unmodified official Godot Engine releases, MIT licensed (GODOT-LICENSE.txt).' \
            'Reassemble *.partNNN with cat; checksums in SHA256SUMS.' > README-BINARIES.md
          find . -name "*.part*" -o -name "*.zip" -o -name "*.pck" -o -name "*.exe" | head

      - name: Push failure log
        if: steps.editor.outcome == 'failure' || steps.templates.outcome == 'failure' || steps.extract.outcome == 'failure' || steps.chunk.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch.log
          git commit -m "Add fetch failure log" || true
          git push || true

      - name: Check step results
        run: |
          echo "editor=${{ steps.editor.outcome }}"
          echo "templates=${{ steps.templates.outcome }}"
          echo "extract=${{ steps.extract.outcome }}"
          echo "chunk=${{ steps.chunk.outcome }}"
          if [ "${{ steps.editor.outcome }}" != "success" ] \
            || [ "${{ steps.templates.outcome }}" != "success" ] \
            || [ "${{ steps.extract.outcome }}" != "success" ] \
            || [ "${{ steps.chunk.outcome }}" != "success" ]; then exit 1; fi

      - name: Commit to toolchain-bin branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan toolchain-bin
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add engine templates SHA256SUMS GODOT-LICENSE.txt README-BINARIES.md
          git commit -m "Add Godot 4.7.2 editor (linux x86_64) and Windows export templates"
          git push --force origin toolchain-bin
