name: fetch-godot-toolchain

# CI relay: GitHub-hosted runners have full network egress, unlike the dev
# sandbox. Downloads official MIT-licensed Godot engine + Windows export
# templates, splits large binaries into git-pushable chunks, commits them to
# the `toolchain-bin` branch. On failure, pushes fetch.log for diagnosis.
on:
  workflow_dispatch:
  push:
    branches: ["arena/7a439bd1-roblox"]
    paths: [".github/workflows/fetch-godot.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Godot editor and export templates
        id: fetch
        continue-on-error: true
        run: |
          set -x
          which curl unzip git
          BASE="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          mkdir -p engine templates
          curl -fL --retry 3 --retry-delay 2 \
            "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o engine/godot-linux-x86_64.zip
          curl -fL --retry 3 --retry-delay 2 \
            "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/tpl.tpz
          mkdir -p /tmp/tplx
          unzip -q /tmp/tpl.tpz -d /tmp/tplx
          ls -la /tmp/tplx/templates | head -20
          cp /tmp/tplx/templates/version.txt templates/
          for n in windows_release_x86_64 windows_debug_x86_64; do
            cp "/tmp/tplx/templates/$n.exe" templates/
            cp "/tmp/tplx/templates/$n.pck" templates/
          done
          curl -fL "https://raw.githubusercontent.com/godotengine/godot/master/LICENSE.txt" \
            -o GODOT-LICENSE.txt
          sha256sum engine/* templates/* GODOT-LICENSE.txt | tee SHA256SUMS
          find engine templates -type f -size +80M -print0 | while IFS= read -r -d '' f; do
            split -b 80M -d -a 3 "$f" "$f.part"
            rm "$f"
          done
          printf '%s\n' '# Godot 4.7.2 stable toolchain (relayed via GitHub Actions)' '' \
            'Unmodified official Godot Engine releases, MIT licensed (GODOT-LICENSE.txt).' \
            'Reassemble *.partNNN with cat; checksums in SHA256SUMS.' > README-BINARIES.md

      - name: Push failure log
        if: steps.fetch.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetch.log 2>/dev/null || true
          git commit -m "Add fetch failure log" || true
          git push || true

      - name: Check fetch result
        run: |
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then exit 1; fi

      - name: Commit to toolchain-bin branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan toolchain-bin
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add engine templates SHA256SUMS GODOT-LICENSE.txt README-BINARIES.md
          git commit -m "Add Godot 4.7.2 editor (linux x86_64) and Windows export templates"
          git push --force origin toolchain-bin
